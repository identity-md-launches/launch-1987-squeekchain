[profile.default]
src = "src"
out = "out"
test = "test"
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The launch compares deployed bytes without a metadata hash; a build with one is not reproducible.
bytecode_hash = "none"
ffi = false
fuzz = { runs = 256, max_test_rejects = 65536 }
